[package]
name = "gaap"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Governed agent-run integrity coordinator"
license = "Apache-2.0"
repository = "https://github.com/nnennandukwe/governed-agent-autonomy-patterns"
publish = false

[dependencies]
schemars = "1.2.2"
serde = { version = "1.0", features = ["derive"] }
serde_jcs = "0.2.0"
serde_json = "1.0"
sha2 = "0.10"

[dev-dependencies]
jsonschema = { version = "0.52.1", default-features = false }

[[example]]
name = "generate-contract-artifacts"
path = "examples/generate-contract-artifacts/main.rs"
test = true

[profile.release]
lto = "thin"
strip = "symbols"
