[package]
name = "gaap-governed-goose"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
publish = false

[workspace]

[dependencies]
gaap = { path = "../..", version = "=0.1.0" }
gaap-acp = { path = "../../adapters/acp", version = "=0.1.0" }
gaap-sandbox = { path = "../../adapters/sandbox", version = "=0.1.0" }
gaap-mcp = { path = "../../adapters/mcp", version = "=0.1.0" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
serde_jcs = "=0.2.0"
sha2 = "=0.10.9"

# Launch-byte pin checks share bounded runtime deadlines, including in dev builds.
[profile.dev.package.sha2]
opt-level = 3
