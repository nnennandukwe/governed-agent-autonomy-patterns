name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm

      - name: Install frozen dependencies
        run: npm ci --ignore-scripts

      - name: Build packages
        run: npm run build

      - name: Resolve the task image to an immutable digest
        shell: bash
        run: |
          docker pull node:20-bullseye
          image="$(docker image inspect node:20-bullseye --format '{{index .RepoDigests 0}}')"
          test -n "$image"
          echo "BOUNDARYBENCH_DOCKER_IMAGE=$image" >> "$GITHUB_ENV"

      - name: Run deterministic, harness, corpus, and Docker tests
        env:
          BOUNDARYBENCH_DOCKER_TEST: "1"
        run: npm test

      - name: Type-check
        run: npm run typecheck

      - name: Dependency audit
        run: npm audit --audit-level=moderate
