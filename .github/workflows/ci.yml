name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  RUN_INVARIANT_COMMIT: e3eb0dfb36390c32d2cd84bbbdf903f5dc55de44

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out GAAP
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check formatting
        run: cargo fmt --check

      - name: Check warnings
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run Rust tests
        run: cargo test --locked

      - name: Build subject binary
        run: cargo build --locked

      - name: Check out pinned RunInvariant
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nnennandukwe/run-invariant
          ref: ${{ env.RUN_INVARIANT_COMMIT }}
          path: .run-invariant

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Reproduce Rust subject evidence
        run: |
          node .run-invariant/bin/run-invariant.js subject --json -- \
            ./target/debug/gaap run-invariant \
            > /tmp/run-invariant-subject.json
          diff -u \
            evidence/run-invariant-subject-v0.1.0.json \
            /tmp/run-invariant-subject.json
