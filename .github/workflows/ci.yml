name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  RUN_INVARIANT_COMMIT: e3eb0dfb36390c32d2cd84bbbdf903f5dc55de44

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      contract: ${{ steps.lanes.outputs.contract }}
      coordinator: ${{ steps.lanes.outputs.coordinator }}
      runtime: ${{ steps.lanes.outputs.runtime }}
    steps:
      - name: Check out GAAP history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Select risk-scoped lanes
        id: lanes
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE_SHA"
            head_sha="$PR_HEAD_SHA"
          else
            base_sha="$PUSH_BASE_SHA"
            head_sha="$PUSH_HEAD_SHA"
          fi

          zero_sha="0000000000000000000000000000000000000000"
          lanes=""
          if [[ -n "$base_sha" && "$base_sha" != "$zero_sha" ]] \
            && git cat-file -e "$base_sha^{commit}" \
            && git cat-file -e "$head_sha^{commit}"; then
            if changed_paths="$(git diff --name-only --no-renames "$base_sha" "$head_sha")"; then
              mapfile -t paths <<< "$changed_paths"
              if ! lanes="$(bash .github/scripts/select-ci-lanes.sh "${paths[@]}")"; then
                lanes="$(bash .github/scripts/select-ci-lanes.sh --uncertain)"
              fi
            fi
          fi
          if [[ -z "$lanes" ]]; then
            lanes="$(bash .github/scripts/select-ci-lanes.sh --uncertain)"
          fi
          printf '%s\n' "$lanes" | tee -a "$GITHUB_OUTPUT"

  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out GAAP
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check formatting
        run: cargo fmt --check

      - name: Check warnings
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run Rust tests
        run: cargo test --locked

      - name: Build subject binary
        run: cargo build --locked

  contract:
    needs: classify
    if: needs.classify.outputs.contract == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out GAAP
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check generated contract artifacts
        run: cargo run --locked --example generate-contract-artifacts -- --check

      - name: Check Agent Run enum consumers and invariants
        run: cargo test --locked --test contracts

      - name: Check Protected Effect enum consumers and invariants
        run: cargo test --locked --test protected_effect_contracts

  coordinator:
    needs: classify
    if: needs.classify.outputs.coordinator == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out GAAP
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build subject binary
        run: cargo build --locked

      - name: Check out pinned RunInvariant
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nnennandukwe/run-invariant
          ref: ${{ env.RUN_INVARIANT_COMMIT }}
          path: .run-invariant

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Reproduce Rust subject evidence
        run: |
          node .run-invariant/bin/run-invariant.js subject --json -- \
            ./target/debug/gaap run-invariant \
            > /tmp/run-invariant-subject.json
          diff -u \
            evidence/run-invariant-subject-v0.1.0.json \
            /tmp/run-invariant-subject.json

  runtime:
    needs: classify
    if: needs.classify.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out GAAP
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check bounded Agent Run runtime
        run: cargo test --locked --test runtime

  mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out GAAP
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check adapter formatting
        run: cargo fmt --manifest-path adapters/mcp/Cargo.toml --check

      - name: Check adapter warnings
        run: cargo clippy --manifest-path adapters/mcp/Cargo.toml --locked --all-targets -- -D warnings

      - name: Exercise real stdio and engine failure paths
        run: cargo test --manifest-path adapters/mcp/Cargo.toml --locked

      - name: Build adapter
        run: cargo build --manifest-path adapters/mcp/Cargo.toml --locked

      - name: Install pinned dependency auditor
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit adapter dependency lockfile
        run: cargo audit --file adapters/mcp/Cargo.lock

  acp:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out GAAP
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check adapter formatting
        run: cargo fmt --manifest-path adapters/acp/Cargo.toml --check

      - name: Check adapter warnings
        run: cargo clippy --manifest-path adapters/acp/Cargo.toml --locked --all-targets -- -D warnings

      - name: Exercise ACP v1 session and engine failure paths
        run: cargo test --manifest-path adapters/acp/Cargo.toml --locked

      - name: Install declared minimum Rust
        run: rustup toolchain install 1.88.0 --profile minimal

      - name: Check minimum Rust compatibility
        run: cargo +1.88.0 test --manifest-path adapters/acp/Cargo.toml --locked

      - name: Build adapter
        run: cargo build --manifest-path adapters/acp/Cargo.toml --locked

      - name: Install pinned dependency auditor
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit adapter dependency lockfile
        run: cargo audit --file adapters/acp/Cargo.lock

  attestation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out GAAP
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up independent JavaScript consumer
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2

      - name: Check attestation formatting and warnings
        run: |
          cargo fmt --manifest-path adapters/attestation/Cargo.toml --check
          cargo clippy --manifest-path adapters/attestation/Cargo.toml --locked --all-targets -- -D warnings

      - name: Verify signatures, contracts, blobs and tamper rejection offline
        run: cargo test --manifest-path adapters/attestation/Cargo.toml --locked

      - name: Check versioned predicate schema
        run: |
          cargo run --manifest-path adapters/attestation/Cargo.toml --locked -- schema > /tmp/gaap-attestation-schema.json
          diff -u adapters/attestation/schema/terminal-run-v1.json /tmp/gaap-attestation-schema.json

      - name: Install declared minimum Rust
        run: rustup toolchain install 1.88.0 --profile minimal

      - name: Check minimum Rust compatibility
        run: cargo +1.88.0 test --manifest-path adapters/attestation/Cargo.toml --locked

      - name: Install pinned dependency auditor
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit attestation dependency lockfile
        run: cargo audit --file adapters/attestation/Cargo.lock

  goose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out GAAP
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check reference formatting and warnings
        run: |
          python3 -m unittest discover -s examples/governed-goose -p 'test_*.py'
          cargo test --manifest-path examples/governed-goose/Cargo.toml --locked
          cargo fmt --manifest-path examples/governed-goose/Cargo.toml --check
          cargo clippy --manifest-path examples/governed-goose/Cargo.toml --locked --all-targets -- -D warnings

      - name: Install pinned Goose locally
        run: python3 examples/governed-goose/install_goose.py /tmp/gaap-goose-1.54.0

      - name: Prove whole-conversation admission and independent verification
        run: |
          python3 examples/governed-goose/run.py --goose /tmp/gaap-goose-1.54.0/goose --output /tmp/gaap-goose-evidence

      - name: Install pinned dependency auditor
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit reference dependency lockfile
        run: cargo audit --file examples/governed-goose/Cargo.lock

  sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out GAAP
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check sandbox formatting, warnings and control failure paths
        run: |
          cargo fmt --manifest-path adapters/sandbox/Cargo.toml --check
          cargo clippy --manifest-path adapters/sandbox/Cargo.toml --locked --all-targets -- -D warnings
          cargo test --manifest-path adapters/sandbox/Cargo.toml --locked

      - name: Install declared minimum Rust
        run: rustup toolchain install 1.88.0 --profile minimal

      - name: Check minimum Rust compatibility
        run: cargo +1.88.0 test --manifest-path adapters/sandbox/Cargo.toml --locked

      - name: Install immutable test image
        run: docker pull python@sha256:2d9aefe2fef018a7eb2c13064c89c71929800fd2e5dccdbf52ea5da5bb8d929a

      - name: Prove real OCI limits, denied access and cleanup
        env:
          GAAP_DOCKER_EXECUTABLE: /usr/bin/docker
          GAAP_DOCKER_HOST: unix:///var/run/docker.sock
        run: cargo test --manifest-path adapters/sandbox/Cargo.toml --locked --test native native_ -- --ignored --test-threads=1

      - name: Install pinned Goose locally
        run: python3 examples/governed-goose/install_goose.py /tmp/gaap-goose-oci-1.54.0

      - name: Prove signed Goose execution and verification in OCI
        run: |
          python3 examples/governed-goose/run.py --goose /tmp/gaap-goose-oci-1.54.0/goose --output /tmp/gaap-goose-oci-evidence --oci

      - name: Install pinned dependency auditor
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit sandbox dependency lockfile
        run: cargo audit --file adapters/sandbox/Cargo.lock

  gvisor:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out GAAP
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install checksum-pinned official runsc
        run: |
          python3 adapters/sandbox/install_runsc.py /tmp/gaap-runsc
          sudo install -m 0755 /tmp/gaap-runsc/runsc /usr/local/bin/runsc
          sudo /usr/local/bin/runsc install --runtime runsc -- --platform=systrap --network=none --directfs=false
          sudo systemctl restart docker
          /usr/local/bin/runsc --version
          docker info --format '{{json .Runtimes}}'

      - name: Install immutable test image
        run: docker pull python@sha256:2d9aefe2fef018a7eb2c13064c89c71929800fd2e5dccdbf52ea5da5bb8d929a

      - name: Diagnose runsc resource envelope
        run: python3 .github/scripts/probe-runsc.py

      - name: Exercise actual runsc isolation and lifecycle failure paths
        env:
          GAAP_DOCKER_EXECUTABLE: /usr/bin/docker
          GAAP_DOCKER_HOST: unix:///var/run/docker.sock
          GAAP_RUNSC_EXECUTABLE: /usr/local/bin/runsc
          GAAP_SANDBOX_EVIDENCE: /tmp/gaap-runsc-native
        run: cargo test --manifest-path adapters/sandbox/Cargo.toml --locked --test native -- --ignored --test-threads=1

      - name: Install pinned Goose locally
        run: python3 examples/governed-goose/install_goose.py /tmp/gaap-goose-gvisor-1.54.0

      - name: Prove signed Agent Runs select gVisor with unchanged contracts
        env:
          GAAP_RUNSC_EXECUTABLE: /usr/local/bin/runsc
        run: python3 examples/governed-goose/run.py --goose /tmp/gaap-goose-gvisor-1.54.0/goose --output /tmp/gaap-goose-gvisor-evidence --gvisor

      - name: Retain original Linux runtime and signed run evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gvisor-evidence-${{ github.sha }}
          path: |
            /tmp/gaap-runsc/installation.json
            /tmp/gaap-runsc-native
            /tmp/gaap-runsc-probes
            /tmp/gaap-goose-gvisor-evidence
          if-no-files-found: error
          retention-days: 14

  final:
    if: always()
    needs:
      - classify
      - baseline
      - contract
      - coordinator
      - runtime
      - mcp
      - acp
      - goose
      - attestation
      - sandbox
      - gvisor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every selected lane to succeed
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          BASELINE_RESULT: ${{ needs.baseline.result }}
          CONTRACT_SELECTED: ${{ needs.classify.outputs.contract }}
          CONTRACT_RESULT: ${{ needs.contract.result }}
          COORDINATOR_SELECTED: ${{ needs.classify.outputs.coordinator }}
          COORDINATOR_RESULT: ${{ needs.coordinator.result }}
          RUNTIME_SELECTED: ${{ needs.classify.outputs.runtime }}
          RUNTIME_RESULT: ${{ needs.runtime.result }}
          MCP_RESULT: ${{ needs.mcp.result }}
          ACP_RESULT: ${{ needs.acp.result }}
          ATTESTATION_RESULT: ${{ needs.attestation.result }}
          GOOSE_RESULT: ${{ needs.goose.result }}
          SANDBOX_RESULT: ${{ needs.sandbox.result }}
          GVISOR_RESULT: ${{ needs.gvisor.result }}
        run: |
          set -euo pipefail
          [[ "$CLASSIFY_RESULT" == "success" ]]
          [[ "$BASELINE_RESULT" == "success" ]]
          [[ "$MCP_RESULT" == "success" ]]
          [[ "$ACP_RESULT" == "success" ]]
          [[ "$GOOSE_RESULT" == "success" ]]
          [[ "$ATTESTATION_RESULT" == "success" ]]
          [[ "$SANDBOX_RESULT" == "success" ]]
          [[ "$GVISOR_RESULT" == "success" ]]
          if [[ "$CONTRACT_SELECTED" == "true" ]]; then
            [[ "$CONTRACT_RESULT" == "success" ]]
          else
            [[ "$CONTRACT_RESULT" == "skipped" ]]
          fi
          if [[ "$COORDINATOR_SELECTED" == "true" ]]; then
            [[ "$COORDINATOR_RESULT" == "success" ]]
          else
            [[ "$COORDINATOR_RESULT" == "skipped" ]]
          fi
          if [[ "$RUNTIME_SELECTED" == "true" ]]; then
            [[ "$RUNTIME_RESULT" == "success" ]]
          else
            [[ "$RUNTIME_RESULT" == "skipped" ]]
          fi
